# nginx перед OPC UA SendBox: только web (UI, REST, WebSocket).
#
#   http :80 -> app:8766
#
# OPC UA (opc.tcp, 4840–5000) идёт мимо nginx напрямую в контейнер приложения.
# TLS для сайта — на уровне хоста (certbot/внешний балансировщик) или добавьте
# server listen 443 ssl сюда. Реальный IP клиента uvicorn читает из
# X-Forwarded-For (FORWARDED_ALLOW_IPS) — на нём держатся лимиты по IP.

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # WebSocket: заголовок Connection должен следовать за Upgrade,
    # пустое значение - обычный HTTP, close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web_backend {
        server app:8766;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;

            # Реальный IP клиента: uvicorn его читает (FORWARDED_ALLOW_IPS).
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket /ws/sessions/*, /ws/shared: upgrade + длинный read timeout,
            # иначе nginx оборвёт простаивающее соединение через 60 с.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
