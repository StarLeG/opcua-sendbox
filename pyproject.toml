[project]
name = "opcua-sendbox"
version = "0.1.2"
description = "OPC UA SendBox - публичная песочница OPC UA серверов (opcua-sendbox.electroman.by)"
requires-python = ">=3.11"
authors = [{ name = "Олег Старинский (StarLeG)" }]
keywords = ["opc-ua", "opcua-server", "simulator", "sandbox", "scada", "industrial-automation"]
dependencies = [
    "asyncua>=2.1,<3",
    "fastapi>=0.162.0",
    "pydantic>=2.14,<3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://opcua-sendbox.electroman.by"
Repository = "https://github.com/StarLeG/opcua-sendbox"
Author = "https://github.com/StarLeG"
"Modbus SendBox" = "https://modbus-sendbox.electroman.by"
ModbusToolkit = "https://modbustoolkit.electroman.by"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "psutil>=7.2.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
# Зависший тест (ожидание сокета, очереди) не должен вешать CI на часы.
timeout = 120
filterwarnings = [
    # starlette советует пакет httpx2 для TestClient; остаёмся на httpx (как Modbus SendBox)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: тесты с реальными OPC UA серверами и процессами (медленные)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
# asyncua.ua собирает ObjectIds/AttributeIds/... из подмодулей без __all__.
module = ["asyncua", "asyncua.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# В тестах asyncua используется напрямую: её аннотации требуют обёрток NewType
# (NodeId(Int32/String, Int16), DateTime) и делают поля DataValue Optional.
# Поведение проверяют сами тесты; в app/ строгая проверка без исключений.
module = ["tests.*"]
disable_error_code = ["arg-type", "union-attr"]
